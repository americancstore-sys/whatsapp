<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encargos · American Clothing</title>
<meta name="theme-color" content="#14213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#14213D; --ink-2:#3B4660; --mute:#6B7487; --line:#D9DDE5;
  --paper:#EEF1F5; --card:#FFFFFF; --label:#FFC93C; --danger:#C23B22; --ok:#1F7A4D;
  --s-abonado:#5B6CFF; --s-encargado:#8A5CF6; --s-llego:#E8890C; --s-saldo_pagado:#0E9F8E;
  --s-despachado:#2563EB; --s-entregado:#1F7A4D; --s-cancelado:#9AA1AE;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--label);outline-offset:2px}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:12px 16px 0}
.top{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.brand{font-stretch:125%;font-weight:800;font-size:18px;letter-spacing:-.01em;flex:1}
.brand small{display:block;font-stretch:100%;font-weight:400;font-size:12px;opacity:.7;letter-spacing:0}
.icon-btn{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:7px 11px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0;max-width:1100px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.1);color:#fff;font-size:13px;white-space:nowrap}
.chip b{font-weight:700;margin-left:4px}
.chip[aria-pressed="true"]{background:#fff;color:var(--ink)}
.chip.alert{background:var(--label);color:var(--ink)}

main{max-width:1100px;margin:0 auto;padding:12px 16px 120px}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.search{flex:1;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:11px 12px}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:0 12px;font-size:13px}
.pick{flex:1;margin:0;font-size:12px;color:var(--mute)}
.pick select{display:block;width:100%;margin-top:3px;border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;background:var(--card);font-size:14px;color:var(--ink)}
.group{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 2px 2px;border-bottom:2px solid var(--ink);margin-top:6px}
.group:first-child{margin-top:0;padding-top:2px}
.group h2{font-stretch:110%;font-weight:800;font-size:17px;margin:0;flex:1;min-width:140px}
.group span{font-size:13px;color:var(--ink-2)}
.group b{font-weight:700}

/* list */
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.order{background:var(--card);border-radius:var(--r);border:1px solid var(--line);display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px;position:relative;text-align:left;width:100%}
.order.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.thumb{width:76px;height:92px;border-radius:8px;background:var(--paper) center/cover no-repeat;display:grid;place-items:center;color:var(--mute);font-size:11px}
.o-top{display:flex;align-items:baseline;gap:8px}
.code{font-stretch:75%;font-weight:700;font-size:13px;color:var(--ink-2)}
.days{margin-left:auto;font-size:12px;color:var(--mute)}
.days.late{color:var(--ink);background:var(--label);padding:1px 7px;border-radius:4px;font-weight:700}
.o-name{font-weight:700;font-size:16px;margin:2px 0 0}
.o-prod{color:var(--ink-2);font-size:14px}
.money{display:flex;gap:12px;font-size:13px;margin-top:6px}
.money span{color:var(--mute)} .money b{font-weight:700}
.money .due{color:var(--danger)}
.check{position:absolute;top:10px;left:10px;width:22px;height:22px;accent-color:var(--ink)}

/* tracker: the one memorable element */
.track{display:flex;gap:3px;margin-top:9px}
.track i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.track i.on{background:var(--c)}
.state{display:inline-block;font-size:12px;font-weight:700;color:var(--c);margin-top:5px}

.empty{text-align:center;color:var(--mute);padding:48px 16px}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* fab + bulk bar */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;background:var(--label);color:var(--ink);border:0;border-radius:14px;padding:15px 20px;font-weight:800;font-size:15px;box-shadow:0 6px 18px rgba(20,33,61,.25)}
.bulk{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--ink);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.bulk span{flex:1;font-size:14px}

/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(20,33,61,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:16px}}
.sheet h2{font-stretch:110%;font-size:20px;margin:0 0 4px;font-weight:800}
.sheet .sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.close{float:right;border:0;background:var(--paper);border-radius:8px;padding:6px 10px}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{font-weight:700;font-size:13px;color:var(--ink-2);margin-bottom:6px;padding:0}
label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:10px}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--mute);margin-top:-6px;margin-bottom:10px}
.found{font-size:12px;color:var(--ok);margin-top:-6px;margin-bottom:10px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.primary{width:100%;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:14px;font-weight:700;font-size:15px}
.primary:disabled{opacity:.5}
.secondary{width:100%;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font-weight:600}
.wa{background:#1FAF5A;color:#fff;border:0}
.actions{display:grid;gap:8px;margin-top:14px}
.photo-pick{display:flex;gap:10px;align-items:center;border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:12px}
.photo-pick img{width:56px;height:68px;object-fit:cover;border-radius:6px}
.photo-pick span{font-size:13px;color:var(--ink-2)}

.d-photo{width:100%;max-height:340px;object-fit:contain;background:var(--paper);border-radius:10px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:10px 0}
.kv dt{color:var(--mute)} .kv dd{margin:0;font-weight:600}
.timeline{list-style:none;padding:0;margin:8px 0 0;font-size:13px}
.timeline li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--paper)}
.timeline time{color:var(--mute);margin-left:auto}
.pays{font-size:13px;margin:6px 0 0;padding:0;list-style:none}
.pays li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--paper)}
.pays li b{margin-left:auto}
h3{font-size:14px;margin:18px 0 4px}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ink)}
.auth-box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:380px}
.auth-box h1{font-stretch:125%;font-weight:800;font-size:26px;margin:0 0 4px;line-height:1.05}
.auth-box p{color:var(--mute);margin:0 0 18px;font-size:14px}
.link{background:none;border:0;color:var(--ink-2);text-decoration:underline;padding:8px 0;font-size:13px}
.msg{font-size:13px;padding:10px;border-radius:8px;margin-bottom:12px}
.msg.err{background:#FBE9E5;color:var(--danger)} .msg.ok{background:#E3F4EA;color:var(--ok)}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px}
.team li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--paper);font-size:14px}
.team li span{flex:1}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>

<!-- AUTH -->
<section id="auth" class="auth hidden">
  <form class="auth-box" id="authForm">
    <h1>Encargos<br>American Clothing</h1>
    <p id="authSub">Entra con tu correo del equipo.</p>
    <div id="authMsg"></div>
    <label>Correo<input type="email" id="authEmail" required autocomplete="email"></label>
    <label>Contraseña<input type="password" id="authPass" required minlength="6" autocomplete="current-password"></label>
    <button class="primary" id="authBtn">Entrar</button>
    <button type="button" class="link" id="authToggle">Primera vez: crear mi contraseña</button>
    <button type="button" class="link" id="authReset">Olvidé mi contraseña</button>
  </form>
</section>

<section id="noAccess" class="auth hidden">
  <div class="auth-box">
    <h1>Correo sin acceso</h1>
    <p id="noAccessTxt"></p>
    <button class="secondary" onclick="logout()">Salir</button>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div class="top">
      <div class="brand">Encargos<small id="who"></small></div>
      <button class="icon-btn" id="btnTeam" title="Equipo">Equipo</button>
      <button class="icon-btn" onclick="logout()">Salir</button>
    </div>
    <nav class="chips" id="chips" aria-label="Filtrar por estado"></nav>
  </header>
  <main>
    <div class="toolbar">
      <input class="search" id="q" type="search" placeholder="Buscar cliente, teléfono, código o producto">
      <button class="ghost" id="btnCsv" title="Descargar lista en CSV">CSV</button>
    </div>
    <div class="toolbar">
      <label class="pick">Agrupar por<select id="grp"><option value="dia">Día</option><option value="asesor">Asesor</option><option value="">Sin agrupar</option></select></label>
      <label class="pick">Asesor<select id="ase"><option value="">Todos</option></select></label>
    </div>
    <div class="list" id="list"></div>
  </main>
  <button class="fab" id="fab">+ Nuevo encargo</button>
  <div class="bulk hidden" id="bulk">
    <span id="bulkTxt"></span>
    <button class="icon-btn" id="bulkCancel">Cancelar</button>
    <button class="chip" style="background:var(--label);color:var(--ink);font-weight:700" id="bulkGo"></button>
  </div>
</div>

<div id="sheetRoot"></div>

<script>
const SB_URL = 'https://ahnvrbhfjxujzjfrwskd.supabase.co';
const SB_KEY = 'sb_publishable_7GshTtt7eXmheoXxVznBMg_oMBnCv3w';
const sb = supabase.createClient(SB_URL, SB_KEY);

const ESTADOS = [
  {k:'abonado', t:'Abonado', next:'encargado', act:'Marcar encargado al proveedor'},
  {k:'encargado', t:'Encargado', next:'llego', act:'Marcar llegó a Colombia'},
  {k:'llego', t:'Llegó', next:'saldo_pagado', act:'Registrar pago del saldo'},
  {k:'saldo_pagado', t:'Saldo pagado', next:'despachado', act:'Marcar despachado'},
  {k:'despachado', t:'Despachado', next:'entregado', act:'Marcar entregado'},
  {k:'entregado', t:'Entregado'},
  {k:'cancelado', t:'Cancelado'}
];
const E = Object.fromEntries(ESTADOS.map(e=>[e.k,e]));
const FLOW = ESTADOS.slice(0,6).map(e=>e.k);
const CANALES = {whatsapp:'WhatsApp', instagram:'Instagram', llamada:'Llamada', grupo_vip:'Grupo VIP', tienda:'Tienda', otro:'Otro'};
const METODOS = ['Nequi','Bancolombia','Daviplata','Efectivo','Transferencia','Otro'];

let me = null, isAdmin = false, rows = [], filter = 'activos', selected = new Set(), photoUrls = {}, team = {};
const pref = (k,d) => { try { return localStorage.getItem('enc_'+k) ?? d; } catch(_) { return d; } };
const setPref = (k,v) => { try { localStorage.setItem('enc_'+k, v); } catch(_) {} };
const asesorName = e => team[e] || (e ? e.split('@')[0] : 'Sin asesor');
const dayKey = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
function dayLabel(k){
  const today = dayKey(new Date()), y = new Date(); y.setDate(y.getDate()-1);
  const d = new Date(k+'T12:00:00');
  const txt = d.toLocaleDateString('es-CO',{weekday:'long', day:'numeric', month:'long'});
  const cap = txt.charAt(0).toUpperCase()+txt.slice(1);
  return k===today ? `Hoy · ${cap}` : k===dayKey(y) ? `Ayer · ${cap}` : cap;
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cop = n => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n)||0);
const num = s => Number(String(s).replace(/[^\d]/g,'')) || 0;
const fdate = d => d ? new Date(d).toLocaleDateString('es-CO',{day:'numeric',month:'short'}) : '';
const fdt = d => d ? new Date(d).toLocaleString('es-CO',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}) : '';
function normPhone(p){ let d = String(p||'').replace(/\D/g,''); if(!d) return ''; if(d.length===10 && d[0]==='3') d='57'+d; return '+'+d; }
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2600); }
function moneyInput(el){ el.addEventListener('input',()=>{ const n=num(el.value); el.value = n ? n.toLocaleString('es-CO') : ''; }); }

/* ---------- AUTH ---------- */
let signupMode = false;
$('#authToggle').onclick = () => {
  signupMode = !signupMode;
  $('#authBtn').textContent = signupMode ? 'Crear contraseña' : 'Entrar';
  $('#authToggle').textContent = signupMode ? 'Ya tengo contraseña: entrar' : 'Primera vez: crear mi contraseña';
  $('#authSub').textContent = signupMode ? 'Usa el correo que el administrador agregó al equipo.' : 'Entra con tu correo del equipo.';
};
$('#authReset').onclick = async () => {
  const email = $('#authEmail').value.trim();
  if(!email){ authMsg('Escribe tu correo arriba y vuelve a tocar "Olvidé mi contraseña".','err'); return; }
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
  authMsg(error ? error.message : 'Te enviamos un correo para cambiar la contraseña.', error?'err':'ok');
};
function authMsg(t,k){ $('#authMsg').innerHTML = `<div class="msg ${k}">${esc(t)}</div>`; }
$('#authForm').onsubmit = async e => {
  e.preventDefault();
  const email = $('#authEmail').value.trim().toLowerCase(), password = $('#authPass').value;
  $('#authBtn').disabled = true;
  if(signupMode){
    const {data, error} = await sb.auth.signUp({email, password, options:{emailRedirectTo: location.origin + location.pathname}});
    $('#authBtn').disabled = false;
    if(error) return authMsg(error.message,'err');
    if(!data.session) return authMsg('Revisa tu correo y confirma la cuenta. Luego vuelve aquí y entra.','ok');
  } else {
    const {error} = await sb.auth.signInWithPassword({email, password});
    $('#authBtn').disabled = false;
    if(error) return authMsg(error.message === 'Invalid login credentials' ? 'Correo o contraseña incorrectos.' : error.message,'err');
  }
};
async function logout(){ await sb.auth.signOut(); location.reload(); }

sb.auth.onAuthStateChange(async (ev, session) => {
  if(ev === 'PASSWORD_RECOVERY'){
    const p = prompt('Escribe tu nueva contraseña (mínimo 6 caracteres)');
    if(p){ const {error}=await sb.auth.updateUser({password:p}); alert(error?error.message:'Contraseña actualizada'); }
  }
});

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ show('auth'); sb.auth.onAuthStateChange((ev,s)=>{ if(s && ev==='SIGNED_IN') location.reload(); }); return; }
  const email = session.user.email.toLowerCase();
  const {data:team} = await sb.from('equipo').select('*').eq('email', email).eq('activo', true).maybeSingle();
  if(!team){ $('#noAccessTxt').textContent = `${email} no está en el equipo. Pide al administrador que lo agregue en la sección Equipo.`; show('noAccess'); return; }
  me = team; isAdmin = team.rol === 'admin';
  $('#who').textContent = team.nombre;
  $('#btnTeam').classList.toggle('hidden', !isAdmin);
  show('app');
  $('#grp').value = pref('grp','dia');
  await loadTeam();
  await load();
  document.addEventListener('visibilitychange', () => { if(!document.hidden) load(); });
}
function show(id){ ['auth','noAccess','app'].forEach(x => $('#'+x).classList.toggle('hidden', x!==id)); }

/* ---------- DATA ---------- */
async function loadTeam(){
  const {data} = await sb.from('equipo').select('email,nombre').order('nombre');
  team = Object.fromEntries((data||[]).map(t=>[t.email, t.nombre]));
  const cur = pref('ase','');
  $('#ase').innerHTML = '<option value="">Todos</option>' + (data||[]).map(t=>`<option value="${esc(t.email)}">${esc(t.nombre)}</option>`).join('');
  $('#ase').value = team[cur] ? cur : '';
}
async function load(){
  const {data, error} = await sb.from('vista_encargos').select('*').order('created_at',{ascending:false}).limit(1000);
  if(error){ toast('No se pudo cargar: '+error.message); return; }
  rows = data;
  await signPhotos(rows.map(r=>r.foto_url).filter(p=>p && !photoUrls[p]));
  render();
}
async function signPhotos(paths){
  if(!paths.length) return;
  const {data} = await sb.storage.from('encargos').createSignedUrls(paths, 60*60*6);
  (data||[]).forEach(d => { if(d.signedUrl) photoUrls[d.path] = d.signedUrl; });
}
async function uploadFile(file, folder){
  let blob = file, ext = (file.name.split('.').pop()||'jpg').toLowerCase();
  if(file.type.startsWith('image/') && !/heic|heif/.test(file.type)){
    try { blob = await shrink(file); ext = 'jpg'; } catch(_){}
  }
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error} = await sb.storage.from('encargos').upload(path, blob, {contentType: blob.type || file.type, upsert:false});
  if(error) throw error;
  return path;
}
function shrink(file){
  return new Promise((res,rej)=>{
    const img = new Image(); img.onload = () => {
      const max = 1600, s = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement('canvas'); c.width = img.width*s; c.height = img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b => b ? res(b) : rej(), 'image/jpeg', .82);
    }; img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}

/* ---------- RENDER ---------- */
function filtered(){
  const q = $('#q').value.trim().toLowerCase(), ase = $('#ase').value;
  return rows.filter(r => {
    if(ase && (r.creado_por||'').toLowerCase() !== ase) return false;
    if(filter==='activos' && ['entregado','cancelado'].includes(r.estado)) return false;
    if(filter==='retrasados' && !r.alerta_retraso) return false;
    if(!['activos','todos','retrasados'].includes(filter) && r.estado!==filter) return false;
    if(!q) return true;
    return [r.codigo,r.cliente_nombre,r.cliente_telefono,r.cliente_instagram,r.producto,r.marca,r.talla].some(v => String(v||'').toLowerCase().includes(q));
  });
}
function render(){
  const cnt = k => rows.filter(r=>r.estado===k).length;
  const late = rows.filter(r=>r.alerta_retraso).length;
  const activos = rows.filter(r=>!['entregado','cancelado'].includes(r.estado)).length;
  const chips = [['activos','En curso',activos]];
  if(late) chips.push(['retrasados','Más de 20 días',late]);
  ESTADOS.forEach(e => chips.push([e.k, e.t, cnt(e.k)]));
  chips.push(['todos','Todos',rows.length]);
  $('#chips').innerHTML = chips.map(([k,t,n]) => `<button class="chip ${k==='retrasados'?'alert':''}" aria-pressed="${filter===k}" data-f="${k}">${t}<b>${n}</b></button>`).join('');
  const list = filtered();
  if(!list.length){
    $('#list').innerHTML = rows.length
      ? `<div class="empty"><strong>Nada en este filtro</strong>Prueba con otro estado o borra la búsqueda.</div>`
      : `<div class="empty"><strong>Aún no hay encargos</strong>Toca “Nuevo encargo” para registrar el primero.</div>`;
  } else {
    const bulkable = filter==='encargado' || filter==='abonado';
    const g = $('#grp').value;
    if(!g){ $('#list').innerHTML = list.map(r => card(r, bulkable)).join(''); }
    else {
      const groups = new Map();
      list.forEach(r => { const k = g==='dia' ? dayKey(r.created_at) : (r.creado_por||'').toLowerCase(); if(!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
      let keys = [...groups.keys()];
      keys = g==='dia' ? keys.sort().reverse() : keys.sort((a,b)=>asesorName(a).localeCompare(asesorName(b),'es'));
      $('#list').innerHTML = keys.map(k => {
        const items = groups.get(k);
        const pagado = items.reduce((s,r)=>s+Number(r.total_pagado||0),0);
        const debe = items.reduce((s,r)=>s+Math.max(0,Number(r.saldo_pendiente||0)),0);
        const title = g==='dia' ? dayLabel(k) : asesorName(k);
        return `<div class="group"><h2>${esc(title)}</h2><span><b>${items.length}</b> encargo${items.length>1?'s':''}</span><span>Recibido <b>${cop(pagado)}</b></span><span>Por cobrar <b>${cop(debe)}</b></span></div>` + items.map(r => card(r, bulkable)).join('');
      }).join('');
    }
  }
  updateBulk();
}
function card(r, bulkable){
  const idx = FLOW.indexOf(r.estado), c = `var(--s-${r.estado})`;
  const img = r.foto_url && photoUrls[r.foto_url] ? `style="background-image:url('${photoUrls[r.foto_url]}')"` : '';
  const late = r.alerta_retraso;
  return `<div class="order ${selected.has(r.id)?'sel':''}" data-id="${r.id}" role="button" tabindex="0" style="--c:${c}">
    ${bulkable ? `<input type="checkbox" class="check" data-sel="${r.id}" ${selected.has(r.id)?'checked':''} aria-label="Seleccionar ${esc(r.codigo)}">` : ''}
    <div class="thumb" ${img}>${img?'':'Sin foto'}</div>
    <div>
      <div class="o-top"><span class="code">${esc(r.codigo)}</span><span class="days ${late?'late':''}">${r.estado==='entregado'?fdate(r.fecha_entregado):r.dias_desde_abono+' días'}</span></div>
      <div class="o-name">${esc(r.cliente_nombre)}</div>
      <div class="o-prod">${esc([r.producto, r.marca, r.talla && 'talla '+r.talla].filter(Boolean).join(' · '))}</div>
      <div class="money"><span>Pagó <b>${cop(r.total_pagado)}</b></span>${r.saldo_pendiente>0?`<span>Debe <b class="due">${cop(r.saldo_pendiente)}</b></span>`:'<span><b style="color:var(--ok)">Pagado</b></span>'}</div>
      ${r.estado==='cancelado' ? '' : `<div class="track">${FLOW.map((k,i)=>`<i class="${i<=idx?'on':''}"></i>`).join('')}</div>`}
      <span class="state">${E[r.estado].t}</span>
    </div>
  </div>`;
}

/* ---------- BULK ---------- */
function updateBulk(){
  const n = selected.size, has = n>0 && (filter==='encargado'||filter==='abonado');
  $('#bulk').classList.toggle('hidden', !has); $('#fab').classList.toggle('hidden', has);
  if(has){ $('#bulkTxt').textContent = `${n} seleccionado${n>1?'s':''}`; $('#bulkGo').textContent = filter==='encargado' ? 'Marcar llegaron' : 'Marcar encargados'; }
}
$('#bulkCancel').onclick = () => { selected.clear(); render(); };
$('#bulkGo').onclick = async () => {
  const to = filter==='encargado' ? 'llego' : 'encargado';
  const {error} = await sb.from('encargos').update({estado:to}).in('id',[...selected]);
  if(error) return toast(error.message);
  toast(`${selected.size} encargo${selected.size>1?'s':''} actualizado${selected.size>1?'s':''}`);
  selected.clear(); filter = to; load();
};

/* ---------- SHEETS ---------- */
function sheet(html){
  $('#sheetRoot').innerHTML = `<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#sbg').onclick = e => { if(e.target.id==='sbg') closeSheet(); };

async function setEstado(id, estado, extra={}){

function advance(r){

  if(nx==='despachado'){
    sheet(`<button class="close" onclick="closeSheet()">Cerrar</button><h2>Despachar ${esc(r.codigo)}</h2><p class="sub">Datos del envío para avisar al cliente.</p>

function payForm(r, isSaldo){
  let metodo='Nequi';

      <label class="photo-pick" for="pComp"><span id="pCompTxt">Adjuntar comprobante (opcional)</span><input type="file" id="pComp" accept="image/*,application/pdf" class="hidden"></label>
      <button class="primary" id="pSave">Guardar pago</button>
    </form>`);
  let tipo = isSaldo||r.estado==='llego' ? 'saldo' : 'abono';
  moneyInput($('#pMonto'));
  $('#segTipo').onclick = e => { const b=e.target.closest('button'); if(!b) return; tipo=b.dataset.v; [...$('#segTipo').children].forEach(x=>x.setAttribute('aria-pressed',x===b)); };
  $('#segMet2').onclick = e => { const b=e.target.closest('button'); if(!b) return; metodo=b.dataset.v; [...$('#segMet2').children].forEach(x=>x.setAttribute('aria-pressed',x===b)); };
  $('#pComp').onchange = e => { $('#pCompTxt').textContent = e.target.files[0]?.name || 'Adjuntar comprobante (opcional)'; };
  $('#fPay').onsubmit = async e => {
    e.preventDefault(); $('#pSave').disabled = true;
    try{
      const monto = num($('#pMonto').value); if(!monto) throw new Error('Escribe el monto');
      const comp = $('#pComp').files[0] ? await uploadFile($('#pComp').files[0],'comprobantes') : null;
      const {error} = await sb.from('pagos').insert({encargo_id:r.id, tipo, monto, metodo, comprobante_url:comp});
      if(error) throw error;
      const nuevoSaldo = r.saldo_pendiente - (tipo==='devolucion'?-monto:monto);
      if(r.estado==='llego' && nuevoSaldo<=0 && tipo!=='devolucion'){ await setEstado(r.id,'saldo_pagado'); }
      else { toast('Pago guardado'); await load(); openDetail(r.id); }
    }catch(err){ toast(err.message); $('#pSave').disabled=false; }
  };

/* WhatsApp message per state (manual send until the API is active) */
function waLink(r){

  const art = [r.producto, r.marca].filter(Boolean).join(' ') + (r.talla?` talla ${r.talla}`:'');
  const M = {
    abonado: `Hola ${nombre}, confirmamos tu encargo ${r.codigo}: ${art}.\nValor total: ${cop(r.valor_total)}\nAbono recibido: ${cop(r.total_pagado)}\nSaldo al llegar: ${cop(r.saldo_pendiente)}\nTe avisamos apenas llegue a Colombia (15 a 20 días aprox.).\nAmerican Clothing`,
    encargado: `Hola ${nombre}, tu pedido ${r.codigo} (${art}) ya fue encargado. Llega en 15 a 20 días aprox. y te avisamos por aquí.\nAmerican Clothing`,
    llego: `Hola ${nombre}, ¡tu ${art} ya llegó a Colombia! (pedido ${r.codigo})\nSaldo pendiente: ${cop(r.saldo_pendiente)}\nEnvíanos el comprobante del pago y tu dirección de envío para despacharlo.\nAmerican Clothing`,
    saldo_pagado: `Hola ${nombre}, recibimos el pago del saldo de tu pedido ${r.codigo}. Lo despachamos en las próximas horas y te compartimos la guía.\nAmerican Clothing`,
    despachado: `Hola ${nombre}, tu pedido ${r.codigo} va en camino${r.transportadora?` con ${r.transportadora}`:''}${r.guia?`, guía ${r.guia}`:''}. ¡Gracias por comprar en American Clothing!`,
    entregado: `Hola ${nombre}, ¿cómo te quedó tu ${r.producto}? Nos encantaría ver una foto. Gracias por confiar en American Clothing.`,
    cancelado: `Hola ${nombre}, te escribimos sobre tu pedido ${r.codigo}.`
  };
  return `https://wa.me/${(r.cliente_telefono||'').replace(/\D/g,'')}?text=${encodeURIComponent(M[r.estado])}`;
}

/* CSV */
$('#btnCsv').onclick = () => {
  const cols = ['codigo','estado','cliente_nombre','cliente_telefono','canal','producto','marca','talla','color','valor_total','total_pagado','saldo_pendiente','fecha_abonado','fecha_encargado','fecha_llego','fecha_saldo_pagado','fecha_despachado','fecha_entregado','transportadora','guia','notas'];
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const csv = [cols.join(',')+',asesor', ...filtered().map(r=>cols.map(c=>q(r[c])).join(',')+','+q(asesorName((r.creado_por||'').toLowerCase())))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
  a.download = `encargos-${new Date().toISOString().slice(0,10)}.csv`; a.click();
};

/* TEAM (admin) */
$('#btnTeam').onclick = async () => {
  const {data} = await sb.from('equipo').select('*').order('created_at');
  sheet(`<button class="close" onclick="closeSheet()">Cerrar</button><h2>Equipo</h2><p class="sub">Solo estos correos pueden entrar. Cada persona crea su contraseña con “Primera vez”.</p>
    <ul class="team" style="list-style:none;padding:0">${(data||[]).map(t=>`<li><span>${esc(t.nombre)}<br><small style="color:var(--mute)">${esc(t.email)} · ${t.rol}</small></span>
      ${t.email!==me.email?`<button class="ghost" style="padding:6px 10px" data-tog="${esc(t.email)}" data-on="${t.activo}">${t.activo?'Quitar acceso':'Dar acceso'}</button>`:''}</li>`).join('')}</ul>
    <form id="fTeam" style="margin-top:14px"><div class="row"><label>Nombre<input id="tmN" required></label><label>Correo<input id="tmE" type="email" required></label></div>
    <label>Rol<select id="tmR"><option value="asesor">Asesor</option><option value="admin">Administrador</option></select></label>
    <button class="primary">Agregar al equipo</button></form>`);
  $('#sheetRoot').querySelectorAll('[data-tog]').forEach(b => b.onclick = async () => {
    await sb.from('equipo').update({activo: b.dataset.on!=='true'}).eq('email', b.dataset.tog); $('#btnTeam').click();
  });
  $('#fTeam').onsubmit = async e => {
    e.preventDefault();
    const {error} = await sb.from('equipo').insert({nombre:$('#tmN').value.trim(), email:$('#tmE').value.trim().toLowerCase(), rol:$('#tmR').value});
    if(error) return toast(error.message); toast('Agregado'); await loadTeam(); $('#btnTeam').click();
  };
};

boot();
</script>
